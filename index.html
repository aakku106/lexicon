<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta
      name="description"
      content="Lexicon is a local-first tech vocabulary trainer: 400+ precise definitions, flashcards, quizzes, distinctions, and spaced review across 19 fields of software engineering."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Lexicon — Tech vocabulary, mastered.</title>
    <script>
      // Apply the saved reading size before first paint to avoid a flash.
      try {
        const prefs = JSON.parse(localStorage.getItem('lexicon.v1.prefs') || '{}')
        const scale = Number(prefs.textScale)
        if (Number.isFinite(scale) && scale >= 0.9 && scale <= 1.5) {
          document.documentElement.style.setProperty('--text-scale', String(scale))
        }
      } catch {
        /* A malformed preference should never block the app. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
